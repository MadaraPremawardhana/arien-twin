<section class="wrap" style="padding-top: 60px; padding-bottom: 80px;"><div style="max-width: 620px; margin: 0px auto;"><button class="btn btn-ghost" id="back" style="margin-bottom: 24px; padding: 8px 14px;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg> Back</button><div class="sec-head" style="margin-bottom: 32px;"><span class="eyebrow">Industry</span><h2>Talk to sales</h2>

<form class="card" id="contact-form" style="display: flex; flex-direction: column; gap: 20px;"><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;"><div><label style="font-family: var(--fm); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(124, 138, 155); display: block; margin-bottom: 6px;">Your name</label><input required="" name="name" placeholder="Dr. Jane Smith" style="width: 100%; border: 1px solid rgb(230, 234, 239); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none; font-family: var(--fb); box-sizing: border-box;"></div>
<div><label style="font-family: var(--fm); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(124, 138, 155); display: block; margin-bottom: 6px;">Email</label><input type="email" required="" name="email" placeholder="jane@company.com" style="width: 100%; border: 1px solid rgb(230, 234, 239); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none; font-family: var(--fb); box-sizing: border-box;"></div>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;"><div><label style="font-family: var(--fm); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(124, 138, 155); display: block; margin-bottom: 6px;">Organisation</label><input name="organisation" placeholder="Sunrise Energy Ltd" style="width: 100%; border: 1px solid rgb(230, 234, 239); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none; font-family: var(--fb); box-sizing: border-box;"></div>
<div><label style="font-family: var(--fm); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(124, 138, 155); display: block; margin-bottom: 6px;">Role</label><input name="role" placeholder="Energy Manager" style="width: 100%; border: 1px solid rgb(230, 234, 239); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none; font-family: var(--fb); box-sizing: border-box;"></div>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;"><div><label style="font-family: var(--fm); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(124, 138, 155); display: block; margin-bottom: 6px;">Number of sites</label><input type="number" min="0" name="num_sites" placeholder="12" style="width: 100%; border: 1px solid rgb(230, 234, 239); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none; font-family: var(--fb); box-sizing: border-box;"></div>
<div><label style="font-family: var(--fm); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(124, 138, 155); display: block; margin-bottom: 6px;">Total capacity (MWp)</label><input type="number" min="0" step="0.1" name="capacity_mwp" placeholder="4.5" style="width: 100%; border: 1px solid rgb(230, 234, 239); border-radius: 10px; padding: 11px 14px; font-size: 14.5px; outline: none; font-family: var(--fb); box-sizing: border-box;"></div>
</div>

# Keeps a copy of the site's weather on the `weather-data` branch, so visitors' browsers
# read it from GitHub instead of calling Open-Meteo's free API, which drops requests at busy
# times (mostly around the full hour). Runs at :23 past each hour, away from that peak,
# and whenever config.json (the published site) changes.
name: Weather cache

on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: [config.json, tools/fetch_weather.py, .github/workflows/weather-cache.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-cache
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start from the previous cache
        run: |
          mkdir -p out
          if git ls-remote --exit-code origin weather-data >/dev/null 2>&1; then
            git fetch --quiet --depth 1 origin weather-data
            git archive FETCH_HEAD | tar -x -C out
          fi
          ls -la out

      - name: Fetch Open-Meteo (thesis variables only)
        run: python3 tools/fetch_weather.py out

      - name: Publish to the weather-data branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet -b weather-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Weather cache $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" weather-data
